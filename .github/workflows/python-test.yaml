name: Python tests/coverage

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex_concierge/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/python-test.yaml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex_concierge/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/python-test.yaml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  test-soliplex-concierge:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
            # Only run coverage on Python >= 3.13.
            - python-version: "3.12"
              pytest-args: "--no-cov"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # '-n auto' parallelizes via pytest-xdist (one worker per core); CI
      # runners have few cores, so 'auto' is portable here.
      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          uv run py.test -s -n auto ${{ matrix.pytest-args }} 2>&1 \
            | tee unit-tests.log

      # Functional tests spin up a throwaway Gitea container (Docker is
      # available on GitHub-hosted runners). They share a module-scoped
      # container fixture, so run them serially (no '-n'). Run on a single
      # Python only -- they don't exercise version-specific behavior.
      - name: Run functional tests
        if: matrix.python-version == '3.13'
        run: |
          set -o pipefail
          uv run py.test -s --no-cov -m needs_docker tests/functional/ 2>&1 \
            | tee functional-tests.log

      # Slack notification lives in 'ci-failure-notify.yaml', which only
      # links to this run (see #90), so record what failed here.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Python ${{ matrix.python-version }} failed"
            echo
            for log in unit-tests.log functional-tests.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log (last 50 lines)</summary>"
              echo
              echo '```'
              tail -n 50 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
