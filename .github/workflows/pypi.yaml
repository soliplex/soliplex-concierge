name: Build & publish soliplex-concierge to pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Pinned: 'python-version-file' resolves requires-python to the
          # newest CPython, ahead of the locked dependencies' wheels.
          python-version: "3.13"
      - name: Build soliplex-concierge
        run: uv build --sdist --wheel
      - name: Publish soliplex-concierge
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
