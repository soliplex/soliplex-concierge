id: "about_soliplex"
name: "About Soliplex"
description: >-
  Ask questions about Soliplex, request a new room, or request access to a
  private room.

suggestions:
  - "What is Soliplex and what can I do here?"
  - "How do I request a new room?"
  - "How do I request access to a private room?"
  - "Which rooms are available to me?"

agent:
  template_id: "default_chat"
  system_prompt: "./prompt.txt"

tools:
  - tool_name: "soliplex.tools.get_current_datetime"
  - tool_name: "soliplex.tools.get_current_user"
  - tool_name: "soliplex.tools.current_run_info"

  # Files room requests as Gitea issues via the Gitea REST API. Edit
  # 'owner' / 'repo' to point at your installation's tracking repo. The
  # Gitea base URL and access token are read at runtime from the
  # installation environment / secrets named below (see
  # installation-snippet.yaml). Register the config class via the
  # installation's 'meta.tool_configs'.
  - tool_name: "soliplex_concierge.tools.gitea.create_gitea_issue"
    owner: "your-gitea-owner"
    repo: "soliplex-requests"
    host: "env:GITEA_HOST"
    token: "secret:GITEA_ACCESS_TOKEN"

skills:
  # The detailed concierge behavior lives in the 'soliplex-concierge-room'
  # filesystem skill shipped by this package; wire its directory into the
  # installation's 'filesystem_skills_paths' (see installation-snippet.yaml).
  installation_skill_names:
    - "soliplex-concierge-room"
  skill_configs:
    - kind: "haiku.rag.skills.rag"
      rag_lancedb_stem: "rag"

allow_mcp: false
