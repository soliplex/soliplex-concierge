# ---------------------------------------------------------------------------
# soliplex-concierge: installation wiring
# ---------------------------------------------------------------------------
# This is NOT a standalone installation. It shows the entries you must merge
# into your existing 'installation.yaml' to enable the 'about_soliplex' room
# shipped beside this file under 'rooms/about_soliplex/'.
#
# After merging, copy 'rooms/about_soliplex/' into your installation's
# 'rooms/' directory and set the GITEA_HOST / GITEA_ACCESS_TOKEN values (see
# the '.env' lines at the bottom).
#
# If your Gitea host's TLS certificate chains to an enterprise / internal CA
# (one not in certifi's bundle), install 'soliplex-concierge[truststore]'
# instead of 'soliplex-concierge': the tool then verifies against the OS trust
# store rather than certifi. See issue #46.
# ---------------------------------------------------------------------------

meta:
  # Register the extension's tool-config class so a room may reference the
  # tool by its 'tool_name' ('soliplex_concierge.tools.gitea.
  # create_gitea_issue'). No edit to Soliplex core is required.
  tool_configs:
    - "soliplex_concierge.config.CreateGiteaIssueToolConfig"

# Point Soliplex at the directories holding the two filesystem skills the
# about-room uses, so they are discovered: 'soliplex-concierge-room' (this
# package's room skill) and 'soliplex-docs' (the Soliplex documentation,
# downloaded from https://github.com/soliplex/soliplex/releases). Adjust the
# paths to wherever the skills are unpacked / installed.
filesystem_skills_paths:
  - "/path/to/soliplex-concierge/skills/soliplex-concierge-room"
  - "/path/to/skills/soliplex-docs"

skill_configs:
  - skill_name: "soliplex-concierge-room"
    kind: "filesystem"
  - skill_name: "soliplex-docs"
    kind: "filesystem"

# The 'create_gitea_issue' tool's 'host'/'token' config values are Soliplex
# interpolation strings ("env:GITEA_HOST" / "secret:GITEA_ACCESS_TOKEN"), so it
# reads the Gitea base URL from the GITEA_HOST environment variable and the
# access token from the GITEA_ACCESS_TOKEN secret, then calls the Gitea REST API
# directly (no MCP server / external binary required).
#
# The GITEA_ACCESS_TOKEN account must have WRITE access to the tracking repo
# (a Write collaborator, or a team with Write on the Issues unit) -- not just
# Read. Gitea lets a Read-only account open issues (and attach files) but
# SILENTLY DROPS their labels, so requests would be filed untagged and slip
# past triage. A fine-grained token additionally needs the 'write:issue' and
# 'read:repository' scopes. See issue #59.
#
# The tool's 'owner'/'repo' config values may likewise be interpolation strings
# ("env:GITEA_OWNER" / "env:GITEA_REPO"); uncomment the entries below and set
# the room config's 'owner'/'repo' to those markers if you prefer to source the
# tracking repo from the environment rather than hard-coding it.
environment:
  - "GITEA_HOST"
  # - "GITEA_OWNER"
  # - "GITEA_REPO"

secrets:
  - secret_name: "GITEA_ACCESS_TOKEN"
    sources:
      - kind: "env_var"
        env_var_name: "GITEA_ACCESS_TOKEN"

# ---------------------------------------------------------------------------
# Matching '.env' entries
# ---------------------------------------------------------------------------
#   # Base URL of your Gitea instance.
#   GITEA_HOST=https://gitea.example.com
#
#   # Access token for the target repo. Its account needs WRITE access, not
#   # just Read: a Read-only account files issues whose labels Gitea silently
#   # drops (issue #59). Create from: <your-gitea-host>/user/settings/applications
#   GITEA_ACCESS_TOKEN=...
#
#   # Optional: only needed if the room config's 'owner'/'repo' use the
#   # "env:GITEA_OWNER" / "env:GITEA_REPO" interpolation markers.
#   GITEA_OWNER=your-gitea-owner
#   GITEA_REPO=soliplex-requests
# ---------------------------------------------------------------------------
