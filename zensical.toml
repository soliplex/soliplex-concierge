[project]
site_name = "Soliplex Concierge"
site_url = "https://soliplex.github.io/soliplex-concierge/"
dev_addr = "127.0.0.1:8001"
repo_name = "soliplex/soliplex-concierge"
repo_url = "https://github.com/soliplex/soliplex-concierge"

nav = [
  { "Home" = "index.md" },
  { "Tasks" = [
    { "Rooms" = [
      { "The concierge" = "tasks/rooms/index.md" },
      { "Setup" = "tasks/rooms/setup.md" },
    ]},
    { "Admin" = [
      { "Administering requests" = "tasks/admin/index.md" },
      { "Room creation" = "tasks/admin/room_creation.md" },
      { "Room access" = "tasks/admin/room_access.md" },
    ]},
  ]},
  { "Skills" = [
    { "Overview" = "skills/index.md" },
    { "soliplex-concierge-installer" = "skills/soliplex-concierge-installer.md" },
    { "soliplex-concierge-room" = "skills/soliplex-concierge-room.md" },
    { "soliplex-concierge-admin" = "skills/soliplex-concierge-admin.md" },
  ]},
  { "Reference" = [
    { "CLI scripts" = "reference/cli.md" },
    { "Python API" = "reference/api.md" },
  ]},
]

# --------------------------------------------------------------------------
# Theme
# --------------------------------------------------------------------------
[project.theme]
language = "en"

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github-alt"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/lightbulb-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to system preference"

# --------------------------------------------------------------------------
# Markdown extensions
# --------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
use_pygments = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
