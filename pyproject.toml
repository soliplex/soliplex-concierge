[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soliplex-concierge"
version = "0.5.dev0"
description = "Soliplex extension for LLM-driven room access / creation requests."
authors = [{ name = "Enfold", email = "info@enfoldsystems.net" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "soliplex",
    "pydantic",
    "pydantic-ai-slim >= 1.100, < 2.0",
    "httpx",
]

[project.optional-dependencies]
# Extras for the 'soliplex-concierge-apply' console script, which wires this
# extension into a generated stack. Kept out of the core deps so the server
# runtime install stays lean: 'pip install soliplex-concierge[apply]'.
apply = [
    "ruamel.yaml",
]

[project.scripts]
# Apply the extension to an existing soliplex-template-generated stack.
soliplex-concierge-apply = "soliplex_concierge.installer:main"

[dependency-groups]
dev = [
    "anyio >= 4.12.1, < 4.13",
    "ruamel.yaml",
    "coverage >= 7.13.5, < 7.14",
    "pytest >= 9.0.2, < 9.1",
    "pytest-cov >= 7.0.0, < 7.1",
    "pytest-asyncio >= 1.3.0, < 1.4",
    "pytest-xdist >= 3.8.0, < 3.9",
    "ruff >= 0.15.6, < 0.16",
    # 'agentskills' CLI used by scripts/build_skills.py to validate each skill.
    "skills-ref",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true  # PEP 420: discover packages without empty __init__.py

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit"]
python_files = "test_*.py"
# 'tests/functional' is skipped by default; run it explicitly (with
# '--no-cov'), e.g. 'uv run py.test --no-cov tests/functional'.
testpaths = ["tests/unit"]
addopts = "--cov=soliplex_concierge --cov=tests/unit --cov=skills --cov-branch --cov-fail-under=100"
filterwarnings = [
]
markers = [
    "needs_docker: functional test requiring a working Docker daemon",
]

[tool.coverage.run]
# 'skill_versions.py' is vendored verbatim into each skill (release/upgrade
# plumbing); its logic is slated to move to the shared 'soliplex-skills'
# library and be tested there, so it is exempt from this project's gate.
# First-party skill scripts (e.g. gitea_issues.py) are covered.
omit = [
    "*/skills/*/scripts/skill_versions.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
exclude = [
]
target-version = "py313"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    # pycodestyle
    "E",
    # flake8-bugbear
    "B",
    # pyupgrade
    "U",
    # isort
    "I",
    # pandas vet
    "PD",
    # tryceratops
    "TRY",
    # flake8-pytest-style
    "PT",
]
ignore = [
    "PT019",  # incorrecly flags '@mock.patch' args as fixtures
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.line-length.enabled = false             # md013
plugins.no-duplicate-heading.enabled = false    # md024
plugins.no-inline-html.enabled = false          # md033
plugins.no-emphasis-as-heading.enabled = false  # md036
plugins.first-line-heading.enabled = false      # md041
plugins.code-block-style.enabled = false        # md046
