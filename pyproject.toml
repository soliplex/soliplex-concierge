[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soliplex-concierge"
version = "0.8.1"
description = "Soliplex extension for LLM-driven room access / creation requests."
authors = [{ name = "Enfold", email = "info@enfoldsystems.net" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx",
    "pydantic",
    "pydantic-ai-slim >= 1.100, < 2.0",
    "pyyaml",
    "ruamel.yaml",             # `soliplex_concierge.installer`
    "soliplex",
    "soliplex-skills >= 0.5",  # `soliplex_concierge.installer`
]

[project.optional-dependencies]
# Opt-in: verify TLS against OS trust store instead of certifi's bundled CAs.
# Useful behind an enterprise/internal CA. See #46.
truststore = ["truststore"]

[project.scripts]
install-concierge = "soliplex_concierge.installer:main"

[dependency-groups]
dev = [
    "anyio >= 4.12.1, < 4.13",
    "coverage >= 7.13.5, < 7.14",
    "pytest >= 9.0.2, < 9.1",
    "pytest-cov >= 7.0.0, < 7.1",
    "pytest-asyncio >= 1.3.0, < 1.4",
    "pytest-xdist >= 3.8.0, < 3.9",
    "ruff >= 0.15.6, < 0.16",
    # ruamel.yaml and soliplex-skills are runtime deps (see [project]), so the
    # test env gets them with the project; only docs tooling is dev-only here.
    # Renders docs/ into site/ for the docs workflow; that workflow installs
    # 'ghp-import' itself (via 'uv run --with') to publish to gh-pages.
    "zensical >= 0.0.43",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true  # PEP 420: discover packages without empty __init__.py

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit"]
python_files = "test_*.py"
# 'tests/functional' is skipped by default; run it explicitly (with
# '--no-cov'), e.g. 'uv run py.test --no-cov tests/functional'.
testpaths = ["tests/unit"]
addopts = "--cov=soliplex_concierge --cov=tests/unit --cov=skills --cov-branch --cov-fail-under=100"
filterwarnings = [
]
markers = [
    "needs_docker: functional test requiring a working Docker daemon",
]

[tool.coverage.run]
# Each skill's 'skill_versions.py' is a thin shim over the shared
# 'soliplex-skills' library (release/upgrade plumbing, tested there), so it is
# exempt from this project's gate. First-party skill scripts (e.g.
# gitea_issues.py) are covered.
omit = [
    "*/skills/*/scripts/skill_versions.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
exclude = [
]
target-version = "py313"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    # pycodestyle
    "E",
    # flake8-bugbear
    "B",
    # pyupgrade
    "U",
    # isort
    "I",
    # pandas vet
    "PD",
    # tryceratops
    "TRY",
    # flake8-pytest-style
    "PT",
]
ignore = [
    "PT019",  # incorrecly flags '@mock.patch' args as fixtures
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.line-length.enabled = false             # md013
plugins.no-duplicate-heading.enabled = false    # md024
plugins.no-inline-html.enabled = false          # md033
plugins.no-emphasis-as-heading.enabled = false  # md036
plugins.first-line-heading.enabled = false      # md041
plugins.code-block-style.enabled = false        # md046


# Lets the `soliplex-skills` console script (and CI) manage the published
# concierge skills without repeating these constants on the command line. Each
# skill's bundled scripts/skill_versions.py hardcodes the same values, since it
# cannot read this file once the skill is installed elsewhere.
[[tool.soliplex-skills.skill]]
name = "soliplex-concierge-installer"
owner = "soliplex"
repo = "soliplex-concierge"
asset_tarball = "soliplex-concierge-installer-skill.tar.gz"
pointer_tag = "installer-skill-latest"
rolling_prefix = "installer-skill"

[[tool.soliplex-skills.skill]]
name = "soliplex-concierge-room"
owner = "soliplex"
repo = "soliplex-concierge"
asset_tarball = "soliplex-concierge-room-skill.tar.gz"
pointer_tag = "room-skill-latest"
rolling_prefix = "room-skill"

[[tool.soliplex-skills.skill]]
name = "soliplex-concierge-admin"
owner = "soliplex"
repo = "soliplex-concierge"
asset_tarball = "soliplex-concierge-admin-skill.tar.gz"
pointer_tag = "admin-skill-latest"
rolling_prefix = "admin-skill"
